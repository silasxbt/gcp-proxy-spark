name: Validate Spark
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -v
      - run: python -m tests.release_audit
      - run: spark fetch singbox --directory .cache/bin
      - run: spark fetch mihomo --directory .cache/bin
      - run: python -m tests.native_check --connections
      - run: sudo apt-get update && sudo apt-get install -y nftables
      - name: Isolated IPv4 and IPv6 counters
        run: sudo env SPARK_ISOLATED_TEST=1 unshare -n "$(command -v python)" -m tests.linux_counters
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: spark fetch singbox --directory .cache/bin
      - run: sudo apt-get update && sudo apt-get install -y nginx nftables python3-venv
      - name: Disposable host lifecycle with simulated CA
        run: sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted "$(command -v python)" -m tests.hosted_deploy
