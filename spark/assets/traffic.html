<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body><main><header><div><p class="eyebrow">GCP PROXY SPARK</p><h1>本月流量</h1></div><span id="status" role="status">正在连接</span></header>

<section class="breakdown"><h2>协议分布</h2><div id="protocols"></div></section>
